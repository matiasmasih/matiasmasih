<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="1" />
      <stop offset="25%" stop-color="#4ECDC4" stop-opacity="1" />
      <stop offset="50%" stop-color="#FF6B6B" stop-opacity="1" />
      <stop offset="75%" stop-color="#4ECDC4" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="1" />
      <!-- Animation: gradient moves left to right -->
      <animate attributeName="x1" values="0%;100%;0%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    <clipPath id="clip1">
      <rect x="5" y="5" width="350" height="200" rx="15" ry="15"/>
    </clipPath>
  </defs>
  
  <!-- Animated gradient border -->
  <rect width="360" height="210" rx="15" ry="15" fill="url(#grad1)"/>
  
  <!-- Business card image -->
  <image href="https://raw.githubusercontent.com/matiasmasih/matiasmasih/main/assets/Business-card.jpg" 
         x="5" y="5" width="350" height="200" 
         clip-path="url(#clip1)" 
         preserveAspectRatio="xMidYMid slice"/>
</svg>
